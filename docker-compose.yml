version: '3.9'

services:
  mongo:
    image: mongo:6
    container_name: flowsync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --replSet rs0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: flowsync-backend
    ports:
      - "8000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - BASE_PATH=/api
      - MONGO_URI=mongodb://mongo:27017/flowsync?replicaSet=rs0&directConnection=true
      - SESSION_SECRET=flowsync-session-secret-key-2024
      - SESSION_EXPIRES_IN=24h
      - GOOGLE_CLIENT_ID=486984686797-tpf6kh5nq1gcqfb2da7bol5u141d5tkc.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_CALLBACK_URL=http://localhost:8000/api/auth/google/callback
      - FRONTEND_ORIGIN=http://localhost:5173
      - FRONTEND_GOOGLE_CALLBACK_URL=http://localhost:5173/auth/callback
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: flowsync-frontend
    ports:
      - "5173:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
